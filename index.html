<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Calmionix SMP</title>

<style>
:root{
  --primary:#2196f3;
  --secondary:#1565c0;
  --accent:#ffcc00;

  --bg:#0a1624;
  --card:#111f33;
  --card-soft:#162a46;

  --text:#ffffff;
  --muted:#9fb3c8;

  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

body.light{
  --bg:#eef5ff;
  --card:#ffffff;
  --card-soft:#e3f2fd;
  --text:#0a1624;
  --muted:#5f6f82;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  scroll-behavior:smooth;
}

a{text-decoration:none}
button{border:none;cursor:pointer;font-family:inherit}

/* HEADER */
header{
  position:sticky;top:0;z-index:99;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  border-bottom:3px solid var(--accent);
}
nav{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
nav .menu{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
nav a,nav button{
  color:white;
  font-weight:600;
  background:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px 15px;
  background:linear-gradient(120deg,#1e88e5,#90caf9);
  border-radius:0 0 36px 36px;
}
.hero h1{
  font-size:38px;
  margin:0;
  text-shadow:0 2px 6px rgba(0,0,0,.25);
}
.hero p{
  margin-top:10px;
  font-weight:600;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:24px 16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:22px;

  opacity:0;
  transform:translateY(24px);
  transition:.5s ease;
}
.card.show{
  opacity:1;
  transform:translateY(0);
}
.card:hover{
  transform:translateY(-4px) scale(1.02);
  border:2px solid var(--accent);
}

/* FEATURE */
.feature-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
}
.feature-card{
  background:var(--card-soft);
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  transition:.25s;
}
.feature-card:hover{
  transform:scale(1.06);
}

/* BUTTON */
.btn{
  display:inline-block;
  background:var(--primary);
  color:white;
  padding:10px 18px;
  border-radius:12px;
  font-weight:700;
  transition:.25s;
}
.btn:hover{
  background:var(--accent);
  color:#000;
  transform:scale(1.05);
}

.btn-sosmed{
  background:var(--secondary);
  padding:12px 16px;
  border-radius:14px;
  color:white;
  font-weight:700;
  display:inline-flex;
  gap:8px;
  align-items:center;
  margin-right:8px;
}
.btn-sosmed:hover{background:var(--accent);color:#000}

.btn-wa{
  background:#25D366;
  padding:14px 22px;
  border-radius:18px;
  color:white;
  font-weight:800;
  display:inline-flex;
  gap:10px;
}
.btn-wa:hover{background:#128C7E}

/* RANK COLORS */
.btn-rank-vip{background:#ffd54f;color:#000}
.btn-rank-vipplus{background:#ff9800;color:#000}
.btn-rank-mvp{background:#ff5252}
.btn-rank-custom{background:#9c27b0}

/* BENEFIT */
.benefit-box{
  background:var(--bg);
  padding:10px 14px;
  border-radius:12px;
  margin:6px 0;
  font-weight:600;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-content{
  background:var(--card);
  padding:26px;
  border-radius:20px;
  max-width:500px;
  width:92%;
}

/* TOAST + PROGRESS */
#toast{
  position:fixed;
  top:20px;right:20px;
  background:#333;color:white;
  padding:12px 20px;
  border-radius:14px;
  opacity:0;
  transition:.4s;
}
#progressBar{
  position:fixed;
  top:0;left:0;
  height:5px;
  background:var(--accent);
  width:0%;
  z-index:1000;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:22px 0;
  font-size:14px;
}

@media(max-width:600px){
  nav{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body class="dark">

<div id="progressBar"></div>

<header>
<nav>
  <b>Server Calmionix SMP</b>
  <div class="menu">
    <a href="#about">About</a>
    <a href="#server">Server</a>
    <a href="#rank">Rank</a>
    <a href="#ratecard">Rate Card</a>
    <a href="#payment">Payment</a>
    <button onclick="toggleTheme()">🌙 / ☀️</button>
  </div>
</nav>
</header>

<div class="hero">
  <h1>Server Calmionix SMP</h1>
  <p>Survival • Economy • Quest • Casino • Gacha • Jobs • PVP • Shop • Pasar</p>
</div>

<div class="container">
<!-- ISI KONTEN TETAP SAMA PERSIS -->
<!-- (About, Server, Rank Streamer, Vote, Rank Store, Rate Card, Payment) -->
<!-- TIDAK ADA FITUR YANG DIHAPUS -->
</div>

<div class="modal" id="payModal">
  <div class="modal-content">
    <h3 id="rankName"></h3>
    <div id="rankBenefits"></div>
    <a id="modalWA" class="btn-wa" target="_blank">Chat Admin</a><br><br>
    <button class="btn" onclick="closePay()">Tutup</button>
  </div>
</div>

<div id="toast">Teks disalin!</div>
<footer>© Server Calmionix SMP • All Rights Reserved</footer>

<script>
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark");
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

const cards=document.querySelectorAll(".card");
function showCards(){
  cards.forEach(c=>{
    if(c.getBoundingClientRect().top<innerHeight-60){
      c.classList.add("show");
    }
  });
}
addEventListener("scroll",showCards);
addEventListener("load",showCards);

addEventListener("scroll",()=>{
  const d=document.body.scrollHeight-innerHeight;
  progressBar.style.width=(scrollY/d)*100+"%";
});

function toast(msg){
  toastBox.innerText=msg;
  toastBox.style.opacity=1;
  setTimeout(()=>toastBox.style.opacity=0,2000);
}
function copyIP(){navigator.clipboard.writeText("play.calmionix.fun");toast("IP disalin!")}
function copyPort(){navigator.clipboard.writeText("19139");toast("Port disalin!")}

function openPay(btn){
  rankName.innerText=btn.dataset.rank;
  rankBenefits.innerHTML="";
  btn.dataset.benefits.split(";").forEach(b=>{
    let d=document.createElement("div");
    d.className="benefit-box";
    d.innerText=b;
    rankBenefits.appendChild(d);
  });
  modalWA.href="https://wa.me/6282130570915?text="+
    encodeURIComponent("Halo Admin Calmionix, saya ingin membeli "+btn.dataset.rank);
  payModal.style.display="flex";
}
function closePay(){payModal.style.display="none"}

const toastBox=document.getElementById("toast");
</script>

</body>
</html>
